services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n8n-aws-sdk-v3-test
    ports:
      - "5678:5678"
    environment:
      - N8N_LOG_LEVEL=debug
    volumes:
      - n8n_data:/home/node/.n8n
      - ./dist:/home/node/.n8n/custom/node_modules/n8n-nodes-aws-sdk-v3/dist:ro
      - ./package.json:/home/node/.n8n/custom/node_modules/n8n-nodes-aws-sdk-v3/package.json:ro
    restart: unless-stopped

volumes:
  n8n_data:
